
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="https://img.odivex.com/img/img_680a828f28d7a4.26832531.jpg" type="image/x-icon">
    <meta property="og:image" content="https://img.odivex.com/img/img_680a828f28d7a4.26832531.jpg" itemprop="thumbnailUrl">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{file_name}} | AS Cinemaa</title>
    <script>
        // Truncate title to 4 letters
        document.title = document.title.split(' | ')[0].substring(0,4) + '... | AS Cinemaa';
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .player-container {
            background: linear-gradient(145deg, #1a1a1a 0%, #0a0a0a 100%);
        }
        .player-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        #notification-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .notification {
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
    </style>
</head>

<body class="bg-[#0A0A0A] text-gray-100">
    <div id="notification-container"></div>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent mb-4">
                AS Cinemaa
            </h1>
            <div class="inline-block bg-black/30 rounded-xl px-6 py-3 border border-white/10">
                <p class="text-lg font-medium text-gray-300 truncate animate__animated animate__fadeIn">
                    {{file_name}}
                </p>
            </div>
        </div>

        <!-- Video Player -->
        <div class="player-container rounded-2xl overflow-hidden mb-12 animate__animated animate__fadeInUp">
            <video id="player" 
                   class="w-full aspect-video"
                   poster="https://via.placeholder.com/800x450/1a1a1a/ffffff?text=Loading+Player"
                   playsinline controls>
                <source src="{{file_url}}" type="video/mp4">
            </video>
        </div>

          <!-- Action Section -->
        <div class="max-w-3xl mx-auto space-y-8">
            <!-- Player Options -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="vlc_player()" class="player-btn bg-black/30 p-4 rounded-xl border border-white/10 hover:border-purple-400 transition-all">
                    <svg class="w-8 h-8 mb-2 mx-auto text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="text-sm">VLC Player</span>
                </button>

                <button onclick="mx_player()" class="player-btn bg-black/30 p-4 rounded-xl border border-white/10 hover:border-blue-400 transition-all">
                    <svg class="w-8 h-8 mb-2 mx-auto text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <span class="text-sm">MX Player</span>
                </button>

                <button onclick="km_player()" class="player-btn bg-black/30 p-4 rounded-xl border border-white/10 hover:border-green-400 transition-all">
                    <svg class="w-8 h-8 mb-2 mx-auto text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                    </svg>
                    <span class="text-sm">KM Player</span>
                </button>

                <button onclick="hd_player()" class="player-btn bg-black/30 p-4 rounded-xl border border-white/10 hover:border-pink-400 transition-all">
                    <svg class="w-8 h-8 mb-2 mx-auto text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                    </svg>
                    <span class="text-sm">4K Player</span>
                </button>
            </div>

            <!-- Download Button -->
            <button onclick="Download()" class="w-full py-4 bg-gradient-to-r from-purple-500 to-blue-500 rounded-xl font-semibold hover:from-blue-500 hover:to-purple-500 transition-all transform hover:scale-[1.02]">
                <div class="flex items-center justify-center space-x-3">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    <span>Download Now</span>
                </div>
            </button>

                <!-- Notifications -->
            <div class="space-y-4">
                <div class="p-4 bg-red-900/20 rounded-xl border border-red-800/50">
                    <p class="text-sm text-red-300 flex items-center space-x-2">
                        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
                        </svg>
                        <span>Video not playing? Try downloading or use external players</span>
                    </p>
                </div>

                <div class="p-4 bg-emerald-900/20 rounded-xl border border-emerald-800/50">
                    <p class="text-sm text-emerald-300 flex items-center space-x-2">
                        <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                        </svg>
                        <span>Need help? Contact <a href="https://t.me/my_Support_group" class="font-semibold underline hover:text-emerald-200">AS Support Group</a></span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-16 border-t border-white/10">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <div class="text-center text-sm text-gray-500">
                <p>© <script>document.write(new Date().getFullYear())</script> AS Cinemaa - Premium Content Platform</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // Player Configuration
        const player = new Plyr('#player', {
            controls: [
                'play-large',
                'play',
                'progress',
                'current-time',
                'mute',
                'volume',
                'settings',
                'fullscreen'
            ],
            settings: ['quality', 'speed'],
            ratio: '16:9',
            keyboard: { focused: true, global: true }
        });

        // Player Event Handlers
        player.on('ready', () => {
            showNotification('Powered By AS Cinemaa', 'green');
        });

        player.on('play', () => {
            registerActivity();
        });

        player.on('error', error => {
            showNotification('Powered By AS Cinemaa', 'red');
        });

        // Network Monitoring
        let isOnline = navigator.onLine;
        window.addEventListener('online', () => handleNetworkChange(true));
        window.addEventListener('offline', () => handleNetworkChange(false));

        function handleNetworkChange(online) {
            isOnline = online;
            const message = online ? '网络连接已恢复' : '网络连接丢失';
            const color = online ? 'green' : 'red';
            showNotification(message, color);
            if(online) player.refresh();
        }

        // External Player Functions
        const videolink = window.location.href.replace("/watch/", "/");
        const playerFunctions = {
            vlc_player: () => window.location.href = `vlc://${videolink}`,
            mx_player: () => window.location.href = `intent:${videolink}#Intent;package=com.mxtech.videoplayer.ad;end`,
            km_player: () => window.location.href = `intent:${videolink}#Intent;package=com.kmplayer;end`,
            hd_player: () => window.location.href = `intent:${videolink}#Intent;package=uplayer.video.player;end`,
            Download: () => {
                if(!isOnline) return showNotification('无法下载 - 无网络连接', 'red');
                window.location.href = videolink;
            }
        };

        // Activity Tracker
        let activityTimeout;
        function registerActivity() {
            clearTimeout(activityTimeout);
            activityTimeout = setTimeout(() => {
                player.pause();
                showNotification('由于不活动，播放已暂停', 'yellow');
            }, 600000); // 10 minutes
        }

        // Notification System
        function showNotification(message, type = 'info') {
            const colors = {
                red: 'border-red-500',
                green: 'border-green-500',
                yellow: 'border-yellow-500',
                info: 'border-blue-500'
            };

            const notification = document.createElement('div');
            notification.className = `notification ${colors[type]}`;
            notification.textContent = message;
            
            const container = document.getElementById('notification-container');
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Security Enhancements
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if(e.ctrlKey || e.key === 'F12') e.preventDefault();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            player.volume = 0.8;
            registerActivity();
        });

        // Assign functions to window
        Object.entries(playerFunctions).forEach(([name, fn]) => {
            window[name] = fn;
        });
    </script>
</body>
</html>
